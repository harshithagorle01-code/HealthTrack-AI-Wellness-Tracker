kind = "web"
previewPath = "/"
title = "HealthTrack AI"
description = "A private personal health and wellness tracker for logging daily habits, setting goals, exploring trends, managing reminders, and receiving non-diagnostic wellness coaching."
version = "1.0.0"
id = "artifacts/healthtrack"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20030

[services.development]
run = "pnpm --filter @workspace/healthtrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/healthtrack", "run", "build" ]
serve = "static"
publicDir = "artifacts/healthtrack/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20030"
BASE_PATH = "/"
